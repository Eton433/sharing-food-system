<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Purchases · SharingFood</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar('purchases', ${customerName})}"></th:block>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <span class="eyebrow">Order history</span>
                <h1>Hi, <span th:text="${customerName}"></span></h1>
                <p>These are your transactions.</p>
            </div>
        </div>

        <div class="table-modern" th:if="${!transactions.isEmpty()}">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Seller</th>
                        <th>Food Item</th>
                        <th>Timestamp</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.foodItem?.seller?.name ?: 'Unknown Seller'}"></td>
                        <td th:text="${transaction.foodItem?.description ?: 'No Description'}"></td>
                        <td th:text="${transaction.timestamp != null ? #temporals.format(transaction.timestamp, 'yyyy/MM/dd HH:mm:ss') : 'Unknown'}"></td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${transaction.status == 'Completed'} ? 'status-completed' : (${transaction.status == 'Cancelled'} ? 'status-cancelled' : 'status-pending')"
                                  th:text="${transaction.status ?: 'Pending'}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state card-surface" th:if="${transactions.isEmpty()}">
            <div class="empty-icon">🧾</div>
            <p>No transactions found.</p>
        </div>

        <a href="/food-items" th:href="@{/food-items}" class="btn btn-primary mt-4">Back to Browse</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script>
        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            // 訂閱買家的通知
            stompClient.subscribe('/topic/buyer/' + '${customerId}', function (message) {
                alert("Notification: " + message.body);
                location.reload(); // 接收通知後重新加載頁面
            });
        });
    </script>
</body>
</html>
