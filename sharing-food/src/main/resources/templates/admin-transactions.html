<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Transactions · SharingFood Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: adminNavbar('transactions')}"></th:block>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <span class="eyebrow">Admin</span>
                <h1>All Transactions</h1>
                <p>Review and manage every transaction across campus.</p>
            </div>
        </div>

        <div class="table-modern" th:if="${transactions.size() > 0}">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Food Item</th>
                        <th>Buyer</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.foodItem?.description ?: 'No Description'}"></td>
                        <td th:text="${transaction.customer.name}"></td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${transaction.status == 'Completed'} ? 'status-completed' : (${transaction.status == 'Cancelled'} ? 'status-cancelled' : 'status-pending')"
                                  th:text="${transaction.status}"></span>
                        </td>
                        <td>
                            <form th:action="@{/transactions/admin/update}" method="post" class="d-flex align-items-center gap-2">
                                <input type="hidden" name="transactionId" th:value="${transaction.id}" />
                                <select name="status" class="form-select form-select-sm" style="width: auto;" th:disabled="${transaction.status == 'Completed' || transaction.status == 'Cancelled'}">
                                    <option value="Pending" th:selected="${transaction.status == 'Pending'}">Pending</option>
                                    <option value="Completed" th:selected="${transaction.status == 'Completed'}">Completed</option>
                                    <option value="Cancelled" th:selected="${transaction.status == 'Cancelled'}">Cancelled</option>
                                </select>
                                <button type="submit" class="btn btn-primary btn-sm" th:disabled="${transaction.status == 'Completed' || transaction.status == 'Cancelled'}">Update</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state card-surface" th:if="${transactions.size() == 0}">
            <div class="empty-icon">🧾</div>
            <p>No transactions found.</p>
        </div>
    </div>
</body>
</html>
