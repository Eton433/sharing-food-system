<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login · SharingFood</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
</head>
<body>
    <div class="auth-shell" style="background: radial-gradient(circle at 12% 18%, rgba(69,58,52,0.35), transparent 40%), radial-gradient(circle at 88% 82%, rgba(43,35,32,0.35), transparent 45%), linear-gradient(135deg, #f3f1ee, #e7e3dd);">
        <div class="auth-card">
            <div class="auth-mark" style="background: linear-gradient(135deg, #2b2320, #5a4c44);">🛠️</div>
            <h1>Admin Login</h1>
            <p class="auth-subtitle">Sign in to manage SharingFood transactions</p>
            <form action="/admin/login" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Admin username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>
            <div class="auth-footer">
                <a th:href="@{/login}">Back to student login</a>
            </div>
        </div>
    </div>
</body>
</html>
