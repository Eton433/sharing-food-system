<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="theme">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --color-primary: #7a2323;
        --color-primary-dark: #5c1717;
        --color-primary-light: #9c3f3f;
        --color-accent: #e0a458;
        --color-accent-dark: #c98a3a;
        --color-bg: #f6f3ee;
        --color-surface: #ffffff;
        --color-text: #2b2320;
        --color-text-muted: #756b64;
        --color-border: #e8e1d8;
        --color-success: #2f9e58;
        --color-success-bg: #e6f6ec;
        --color-warning: #b8790f;
        --color-warning-bg: #fbf0dd;
        --color-danger: #c0392b;
        --color-danger-bg: #fbe9e7;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --shadow-sm: 0 1px 3px rgba(43, 35, 32, 0.08);
        --shadow-md: 0 8px 24px rgba(43, 35, 32, 0.10);
        --shadow-lg: 0 20px 45px rgba(43, 35, 32, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    body { min-height: 100vh; }

    h1, h2, h3, h4, h5 {
        font-family: 'Poppins', 'Inter', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        font-weight: 700;
        color: var(--color-text);
        letter-spacing: -0.01em;
    }

    a { color: var(--color-primary); }
    a:hover { color: var(--color-primary-dark); }

    /* ---------- Layout shells ---------- */
    .page-shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 24px 64px;
    }

    .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 28px;
    }

    .page-header h1 {
        font-size: 1.9rem;
        margin: 0 0 4px;
    }

    .page-header p {
        color: var(--color-text-muted);
        margin: 0;
    }

    .eyebrow {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-accent-dark);
        background: #fdf3e4;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 10px;
    }

    /* ---------- Navbar ---------- */
    .app-navbar {
        background: linear-gradient(120deg, var(--color-primary-dark), var(--color-primary));
        box-shadow: var(--shadow-sm);
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .app-navbar .navbar-inner {
        max-width: 1080px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 24px;
        flex-wrap: wrap;
    }

    .app-navbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: #fff;
        text-decoration: none;
        margin-right: 8px;
    }

    .app-navbar .brand .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
    }

    .app-navbar .nav-links {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        flex: 1;
    }

    .app-navbar .nav-links a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 999px;
        transition: background-color 0.2s ease, color 0.2s ease;
        white-space: nowrap;
    }

    .app-navbar .nav-links a:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
    }

    .app-navbar .nav-links a.active {
        background: rgba(255, 255, 255, 0.94);
        color: var(--color-primary-dark);
    }

    .app-navbar .nav-user {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 0.88rem;
    }

    .app-navbar .nav-user .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--color-accent);
        color: #4a2c0c;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.82rem;
    }

    .app-navbar .btn-logout {
        color: #fff;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        transition: background-color 0.2s ease;
    }

    .app-navbar .btn-logout:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
    }

    @media (max-width: 720px) {
        .app-navbar .navbar-inner {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 12px 16px;
        }
        .app-navbar .brand { order: 1; margin-right: 0; }
        .app-navbar .nav-links {
            order: 2;
            flex: none;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .app-navbar .nav-links::-webkit-scrollbar { display: none; }
        .app-navbar .nav-user { order: 3; }
        .app-navbar .btn-logout { order: 4; text-align: center; }
    }

    /* ---------- Cards ---------- */
    .card-surface {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
    }

    /* ---------- Buttons (override bootstrap) ---------- */
    .btn {
        border-radius: 999px !important;
        font-weight: 600;
        padding: 9px 20px;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
        background-color: var(--color-primary) !important;
        border-color: var(--color-primary) !important;
    }

    .btn-primary:hover, .btn-primary:focus {
        background-color: var(--color-primary-dark) !important;
        border-color: var(--color-primary-dark) !important;
        box-shadow: var(--shadow-sm);
    }

    .btn-outline-success {
        color: var(--color-primary) !important;
        border-color: var(--color-primary) !important;
    }

    .btn-outline-success:hover {
        background-color: var(--color-primary) !important;
        border-color: var(--color-primary) !important;
    }

    .btn-danger {
        background-color: var(--color-danger) !important;
        border-color: var(--color-danger) !important;
    }

    .btn-danger:hover {
        background-color: #a3291c !important;
        border-color: #a3291c !important;
    }

    .btn-info {
        background-color: #eef1f5 !important;
        border-color: #dde2e8 !important;
        color: var(--color-text) !important;
    }

    .btn-info:hover {
        background-color: #e1e6ec !important;
        color: var(--color-text) !important;
    }

    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

    /* ---------- Forms ---------- */
    /* Baseline layout in case a page forgets to load Bootstrap; Bootstrap's own rules (if present) take over visually identically. */
    .form-label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--color-text);
        margin-bottom: 6px;
    }

    .form-control, .form-select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
        padding: 10px 12px;
        font-size: 1rem;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--color-primary-light);
        box-shadow: 0 0 0 3px rgba(122, 35, 35, 0.12);
    }

    /* ---------- Tables ---------- */
    .table-modern {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--color-border);
    }

    .table-modern table { margin-bottom: 0; }

    .table-modern thead th {
        background: #faf7f2;
        color: var(--color-text-muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
        border-bottom: 1px solid var(--color-border);
        padding: 14px 16px;
    }

    .table-modern tbody td {
        padding: 14px 16px;
        vertical-align: middle;
        border-color: var(--color-border);
    }

    .table-modern tbody tr:hover { background: #fcfaf7; }

    /* ---------- Status badges ---------- */
    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 999px;
        text-transform: capitalize;
    }

    .status-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }

    .status-pending { background: var(--color-warning-bg); color: var(--color-warning); }
    .status-completed { background: var(--color-success-bg); color: var(--color-success); }
    .status-cancelled { background: var(--color-danger-bg); color: var(--color-danger); }

    /* ---------- Empty state ---------- */
    .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--color-text-muted);
    }

    .empty-state .empty-icon {
        font-size: 2.2rem;
        margin-bottom: 10px;
    }

    /* ---------- Alerts ---------- */
    .alert {
        border-radius: var(--radius-sm);
        border: none;
    }

    /* ---------- Auth shell (login pages) ---------- */
    .auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 12% 18%, rgba(224, 164, 88, 0.35), transparent 40%),
            radial-gradient(circle at 88% 82%, rgba(122, 35, 35, 0.28), transparent 45%),
            linear-gradient(135deg, #fbf7f0, #f2ece2);
    }

    .auth-card {
        max-width: 420px;
        width: 100%;
        padding: 44px 40px;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        text-align: center;
        position: relative;
        z-index: 1;
    }

    .auth-card .auth-mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 16px;
        box-shadow: var(--shadow-md);
    }

    .auth-card h1 {
        font-size: 1.5rem;
        margin-bottom: 6px;
    }

    .auth-card .auth-subtitle {
        color: var(--color-text-muted);
        font-size: 0.9rem;
        margin-bottom: 26px;
    }

    .auth-card .form-label { text-align: left; }
    .auth-card .mb-3 { margin-bottom: 14px; }

    .auth-card .auth-footer {
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--color-text-muted);
    }

    .auth-card .auth-footer a { font-weight: 600; text-decoration: none; }

    /* ---------- Action / dashboard cards on index ---------- */
    .action-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 28px;
    }

    .action-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 24px;
        text-decoration: none;
        color: var(--color-text);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .action-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
        border-color: var(--color-accent);
        color: var(--color-text);
    }

    .action-card .action-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        background: #fdf3e4;
        color: var(--color-accent-dark);
    }

    .action-card h3 {
        font-size: 1.05rem;
        margin: 0;
    }

    .action-card p {
        margin: 0;
        font-size: 0.86rem;
        color: var(--color-text-muted);
    }

    /* ---------- Food item cards ---------- */
    .food-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 22px;
    }

    .food-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .food-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
    }

    .food-card .food-image {
        width: 100%;
        height: 170px;
        object-fit: cover;
        background: #f1ece3;
    }

    .food-card .food-body {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
    }

    .food-card .food-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
    }

    .food-card .food-title {
        font-weight: 700;
        font-size: 1.02rem;
        line-height: 1.3;
    }

    .food-card .food-price {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        color: var(--color-primary);
        white-space: nowrap;
    }

    .food-card .food-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.84rem;
        color: var(--color-text-muted);
    }

    .food-card .food-meta span { color: var(--color-text); font-weight: 500; }

    .food-card .food-actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
        padding-top: 6px;
    }

    .food-card .food-actions .btn { flex: 1; }

    /* ---------- Section card wrapper for forms/maps ---------- */
    .section-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 28px;
    }

    #map {
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--color-border);
    }
</style>
</th:block>
</head>
<body></body>
</html>
