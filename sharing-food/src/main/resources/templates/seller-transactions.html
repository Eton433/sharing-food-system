<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Sold Items · SharingFood</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
    <style>
        .action-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar('sales', ${sellerName})}"></th:block>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <span class="eyebrow">Seller dashboard</span>
                <h1>Hi, <span th:text="${sellerName}"></span></h1>
                <p>These are your sold items.</p>
            </div>
        </div>

        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="table-modern" th:if="${transactions.size() > 0}">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Food Item</th>
                        <th>Buyer</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.id}"></td>
                        <td th:text="${transaction.foodItem?.description ?: 'No Description'}"></td>
                        <td th:text="${transaction.customer.name}"></td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${transaction.status == 'Completed'} ? 'status-completed' : (${transaction.status == 'Cancelled'} ? 'status-cancelled' : 'status-pending')"
                                  th:text="${transaction.status}"></span>
                        </td>
                        <td>
                            <form th:action="@{/transactions/update}" method="post" class="update-form">
                                <input type="hidden" name="transactionId" th:value="${transaction.id}" />
                                <div class="action-container">
                                    <select name="status"
                                            class="form-select form-select-sm"
                                            th:disabled="${transaction.status == 'Completed' || transaction.status == 'Cancelled'}">
                                        <option value="Pending" th:selected="${transaction.status == 'Pending'}">Pending</option>
                                        <option value="Completed" th:selected="${transaction.status == 'Completed'}">Completed</option>
                                        <option value="Cancelled" th:selected="${transaction.status == 'Cancelled'}">Cancelled</option>
                                    </select>
                                    <button type="button"
                                            class="btn btn-primary btn-sm update-btn"
                                            th:disabled="${transaction.status == 'Completed' || transaction.status == 'Cancelled'}">
                                        Update
                                    </button>
                                </div>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state card-surface" th:if="${transactions.size() == 0}">
            <div class="empty-icon">📦</div>
            <p>No transactions found.</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // 綁定按鈕點擊事件
            $('.update-btn').click(function (e) {
                e.preventDefault();
                const form = $(this).closest('.update-form');
                const transactionId = form.find('input[name="transactionId"]').val();
                const status = form.find('select[name="status"]').val();

                // 發送 AJAX 請求
                $.ajax({
                    url: '/transactions/update',
                    type: 'POST',
                    data: {
                        transactionId: transactionId,
                        status: status
                    },
                    success: function (response) {
                        alert('Transaction status updated successfully!');
                        location.reload(); // 成功後刷新頁面
                    },
                    error: function (xhr) {
                        alert('Failed to update transaction status: ' + xhr.responseText);
                    }
                });
            });
        });
    </script>
</body>
</html>
