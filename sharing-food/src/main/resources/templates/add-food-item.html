<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Food Item · SharingFood</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
    <style>
        #map { height: 100%; min-height: 320px; }
        .add-item-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 28px;
        }
        @media (max-width: 860px) {
            .add-item-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar('add', ${customer != null ? customer.name : null})}"></th:block>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <span class="eyebrow">Share food</span>
                <h1>Add Food Item</h1>
                <p>Tell us what you're sharing and where to find it.</p>
            </div>
        </div>

        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div th:if="${suggestedImage}" class="mb-3">
            <img th:src="${suggestedImage}" alt="Suggested Image" class="img-thumbnail" style="max-width: 220px; border-radius: 12px;">
        </div>

        <form id="addFoodForm" action="/food-items/add" method="post" enctype="multipart/form-data">
            <div class="add-item-grid">
                <div class="section-card">
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" name="description" id="description" class="form-control" placeholder="e.g. Leftover pizza, still warm" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" step="0.01" name="price" id="price" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" name="quantity" id="quantity" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="expiryDate" class="form-label">Expiry Date</label>
                        <input type="date" name="expiryDate" id="expiryDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">Image</label>
                        <input type="file" name="image" id="image" class="form-control" accept="image/*" required>
                    </div>
                    <div class="mb-1">
                        <label for="location" class="form-label">Location (e.g., 3F Room 301)</label>
                        <input type="text" name="location" id="location" class="form-control" required>
                    </div>
                </div>

                <div class="section-card">
                    <label class="form-label">Pin the exact spot on the map</label>
                    <div id="map"></div>
                    <input type="hidden" name="latitude" id="latitude">
                    <input type="hidden" name="longitude" id="longitude">
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4">Add Food Item</button>
        </form>
    </div>

    <script>
        // 初始化地圖，設置中心點和縮放級別
        var map = L.map('map').setView([24.979319, 121.575555], 17);

        // 添加 OpenStreetMap 瓦片圖層
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 點擊地圖以選擇位置
        var marker;

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            // 在地圖上添加或更新標記
            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup('Selected location: ' + lat.toFixed(5) + ', ' + lng.toFixed(5))
                .openPopup();

            // 將經緯度設置到隱藏字段中
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
        });

        // 表單提交前進行驗證
        document.getElementById('addFoodForm').addEventListener('submit', function(event) {
            var latitude = document.getElementById('latitude').value;
            var longitude = document.getElementById('longitude').value;

            // 如果經緯度未填寫，阻止表單提交並提示用戶
            if (!latitude || !longitude) {
                event.preventDefault();
                alert("Please select a location on the map before submitting the form.");
            }
        });
    </script>
</body>
</html>
