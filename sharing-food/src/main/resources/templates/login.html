<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · SharingFood</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: theme}"></th:block>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-mark">🍱</div>
            <h1>Student Login</h1>
            <p class="auth-subtitle">Sign in with your NCCU account to share and claim food on campus</p>
            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">NCCU Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="you@nccu.edu.tw" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>
            <div class="auth-footer">
                Staff member? <a th:href="@{/admin/login}">Admin login</a>
            </div>
        </div>
    </div>
</body>
</html>
